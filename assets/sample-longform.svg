<svg xmlns="http://www.w3.org/2000/svg" width="720" height="2800" viewBox="0 0 720 2800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f3e9"/><stop offset="1" stop-color="#e9eef2"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a7cff"/><stop offset="1" stop-color="#64d8ff"/></linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b7ef24"/><stop offset="1" stop-color="#61cf42"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity=".16"/></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#1b2430" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="720" height="2800" fill="url(#bg)"/>
  <rect width="720" height="2800" fill="url(#grid)"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#101318">
    <text x="54" y="78" font-size="22" font-weight="700" letter-spacing="4">SAMPLE LONGFORM / 01</text>
    <text x="54" y="190" font-size="92" font-weight="800">MOVE</text>
    <text x="54" y="282" font-size="92" font-weight="800">REST</text>
    <text x="54" y="374" font-size="92" font-weight="800">RESET</text>
    <text x="54" y="432" font-size="25">A modular visual story about daily rhythm and recovery.</text>
  </g>

  <g transform="translate(430 82)" filter="url(#shadow)">
    <circle cx="92" cy="92" r="92" fill="#11151b"/>
    <circle cx="92" cy="92" r="62" fill="none" stroke="#b7ef24" stroke-width="24" stroke-dasharray="245 145" transform="rotate(-52 92 92)"/>
    <circle cx="92" cy="92" r="25" fill="#f5f1e7"/>
    <path d="M92 92L151 50" stroke="#f5f1e7" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g transform="translate(54 520)">
